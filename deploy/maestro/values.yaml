# Default values for Maestro.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageOverrides:
    maestro_image: quay.io/redhat-user-workloads/crt-redhat-acm-tenant/maestro-mce-217:latest
    postgres_image: quay.io/stolostron/postgresql-16:9.5-1732622748
  pullSecret: null
  pullPolicy: IfNotPresent
  namespace: maestro
  deployOnOCP: true

hubconfig:
  nodeSelector: null
  tolerations: []
  proxyConfigs: {}
  replicaCount: 1
  ocpVersion: 4.12.0

maestro:
  logLevel: 2

database:
  useExternalDB: false
  storage: 1Gi

org: open-cluster-management
